{% extends "base.html" %}

{% block title %}Sprawdź email — Selectio Positiva{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Konto</p>
  <h1 class="auth-brand">Sprawdź <em>email</em></h1>
  <p class="lede">
    Jeśli konto z podanym adresem istnieje, wysłaliśmy wiadomość z linkiem
    do resetu hasła. Sprawdź skrzynkę (oraz spam).
  </p>
  <p class="hint auth-alt"><a href="{% url 'login' %}">← Wróć do logowania</a></p>
</section>
{% endblock %}
